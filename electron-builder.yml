appId: fr.ekaufmann.devflux
productName: DevFlux
directories:
  buildResources: resources
  output: ../build
files:
  - out/**
  - package.json
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/win32/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/arm64/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/x64/libonnxruntime_providers_cuda.so'
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/x64/libonnxruntime_providers_tensorrt.so'
  - '!node_modules/@img/sharp-wasm32/**'
asarUnpack:
  - node_modules/better-sqlite3/**
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
linux:
  target:
    - AppImage
  category: Development
  executableName: devflux
  synopsis: Veille technologique quotidienne
